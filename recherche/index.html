<script>
(function () {
  var D = null, q = document.getElementById('q'), res = document.getElementById('res'), compte = document.getElementById('compte');
  var EX = ['Klem', 'Bruckner', 'crypte', 'Morey', 'zeppelin', '1871', 'vitrail', 'Jeanne d’Arc'];
  document.getElementById('ex').innerHTML = EX.map(function (e) { return '<button type="button">' + e + '</button>'; }).join('');
  document.getElementById('ex').addEventListener('click', function (e) { if (e.target.tagName === 'BUTTON') { q.value = e.target.textContent; go(); } });
  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').toLowerCase(); }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function surl(t, mots) {
    var n = norm(t), i = -1;
    for (var k = 0; k < mots.length && i < 0; k++) i = n.indexOf(mots[k]);
    var a = Math.max(0, i - 90), b = Math.min(t.length, (i < 0 ? 0 : i) + 200);
    var s = t.slice(a, b), ns = norm(s), out = '', pos = 0;
    var re = new RegExp(mots.map(function (m) { return m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g'), m;
    while ((m = re.exec(ns))) { out += esc(s.slice(pos, m.index)) + '<mark>' + esc(s.slice(m.index, m.index + m[0].length)) + '</mark>'; pos = m.index + m[0].length; if (!m[0].length) break; }
    return (a ? '… ' : '') + out + esc(s.slice(pos)) + (b < t.length ? ' …' : '');
  }
  function go() {
    var v = q.value.trim();
    try { history.replaceState(null, '', v ? '?q=' + encodeURIComponent(v) : location.pathname); } catch (e) {}
    if (!D) return;
    var mots = norm(v).split(/\s+/).filter(function (m) { return m.length > 1 || /\d/.test(m); });
    if (!mots.length) { res.innerHTML = ''; compte.textContent = ''; return; }
    var r = [];
    D.forEach(function (d) {
      var h = norm(d.h + ' ' + d.p), t = norm(d.t), sc = 0;
      for (var k = 0; k < mots.length; k++) {
        var inH = h.indexOf(mots[k]) >= 0, inT = t.indexOf(mots[k]) >= 0;
        if (!inH && !inT) return;
        sc += (inH ? 10 : 0) + (inT ? 1 + Math.min(5, t.split(mots[k]).length - 2) : 0);
      }
      r.push([sc, d]);
    });
    r.sort(function (a, b) { return b[0] - a[0]; });
    compte.textContent = r.length ? r.length + ' résultat' + (r.length > 1 ? 's' : '') : 'Aucun résultat.';
    res.innerHTML = r.slice(0, 60).map(function (x) {
      var d = x[1], pg = d.u === '/' ? 'Accueil' : d.p;
      return '<li><a href="' + d.u + '"><span class="pg">' + esc(pg) + '</span><span class="ti">' + esc(d.h || pg) + '</span><p>' + surl(d.t, mots) + '</p></a></li>';
    }).join('');
  }
  var t0; q.addEventListener('input', function () { clearTimeout(t0); t0 = setTimeout(go, 120); });
  var p = new URLSearchParams(location.search).get('q'); if (p) q.value = p;
  fetch('/assets/data/recherche.json?v=2').then(function (r) { return r.json(); }).then(function (d) { D = d; go(); });
})();
</script>
